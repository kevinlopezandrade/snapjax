[project]
name = "snapjax"
version = "0.0.1"
description = "Practical Real Time Recurrent Learning with a Sparse Approximation"
readme = "README.md"
authors = [{ name = "Kevin Lopez", email = "kevinlo@ethz.ch" }]
requires-python = ">=3.13,<3.14"
# Pin the tested JAX/native-kernel stack; uv.lock records all dependencies.
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "equinox==0.13.8",
    "numba==0.68.1",
    "numpy>=2.5.4,<2.6",
    "scipy>=1.18.1,<2",
    "chex==0.1.92",
    "jaxtyping>=0.3.11,<0.4",
    "networkx>=3.7,<4",
    "optax==0.2.9",
]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]==0.12.0.1; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.2,<10"]
experiments = ["minfx==0.7.5", "matplotlib>=3.11.2,<4"]

[tool.hatch.build]
exclude = ["*.so", "snapjax/display-gpu-info.sh"]

[tool.hatch.build.targets.wheel]
packages = ["snapjax"]
exclude = ["snapjax/spp_primitives/gpu"]

[tool.pytest.ini_options]
testpaths = ["snapjax/tests"]
markers = ["slow: original large-network regression cases"]

[tool.isort]
profile = "black"
