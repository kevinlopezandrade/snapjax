[project]
name = "snapjax"
version = "0.0.1"
description = "Practical Real Time Recurrent Learning with a Sparse Approximation"
readme = "README.md"
authors = [{ name = "Kevin Lopez", email = "kevinlo@ethz.ch" }]
requires-python = ">=3.11,<3.12"
# Keep the JAX/custom-call baseline fixed while restoring CPU support.
dependencies = [
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "equinox==0.11.10",
    "numba==0.61.2",
    "numpy>=1.26.4,<2",
    "scipy>=1.12,<1.16",
    "chex==0.1.88",
    "jaxtyping>=0.2.25,<0.3",
    "networkx>=3.2.1,<4",
    "optax==0.2.4",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.2,<9"]

[tool.hatch.build]
exclude = ["snapjax/spp_primitives/gpu", "*.so", "snapjax/display-gpu-info.sh"]

[tool.hatch.build.targets.wheel]
packages = ["snapjax"]

[tool.pytest.ini_options]
testpaths = ["snapjax/tests"]
markers = ["slow: original large-network regression cases"]

[tool.isort]
profile = "black"
